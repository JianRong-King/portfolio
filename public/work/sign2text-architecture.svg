<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 770" width="1440" height="770" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <style>
      .mono { font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
      .title { fill: #f4f6f5; font-size: 17px; font-weight: 600; letter-spacing: .2px; }
      .sub { fill: #8b9a92; font-size: 11.5px; letter-spacing: .3px; }
      .grouphead { fill: #4a9e8c; font-size: 12px; font-weight: 700; letter-spacing: 2.4px; }
      .edge-label { fill: #8b9a92; font-size: 12.5px; letter-spacing: .2px; }
      .edge-accent { fill: #5bb39e; font-size: 13px; font-weight: 600; }
      .flow { fill: none; stroke: #4a9e8c; stroke-width: 1.6; opacity: .75; }
      .flow-dim { fill: none; stroke: #4a9e8c; stroke-width: 1.4; opacity: .45; stroke-dasharray: 5 5; }
    </style>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#4a9e8c" opacity="0.06"/>
    </pattern>

    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2830"/>
      <stop offset="1" stop-color="#161e25"/>
    </linearGradient>

    <filter id="lift" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#4a9e8c" opacity=".85"/>
    </marker>
    <marker id="ah-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#4a9e8c" opacity=".5"/>
    </marker>
  </defs>

  <rect width="1440" height="770" fill="#0f1419"/>
  <rect width="1440" height="770" fill="url(#dots)"/>

  <!-- header -->
  <text class="mono" x="48" y="58" fill="#f4f6f5" font-size="24" font-weight="700" letter-spacing="-.3px">sign2text</text>
  <text x="48" y="84" class="sub" font-size="13">Real-time sign language recognition &#8594; natural language, end to end</text>
  <rect x="48" y="100" width="52" height="2" rx="1" fill="#4a9e8c"/>

  <!-- ===== FRONTEND GROUP ===== -->
  <rect x="48" y="130" width="330" height="560" rx="18" fill="url(#panel)" stroke="#4a9e8c" stroke-opacity=".3" stroke-width="1.2"/>
  <rect x="48.6" y="130.6" width="328.8" height="558.8" rx="17.4" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
  <rect x="72" y="154" width="112" height="26" rx="13" fill="#4a9e8c" fill-opacity=".14" stroke="#4a9e8c" stroke-opacity=".32"/>
  <text x="128" y="171" class="grouphead" text-anchor="middle">FRONTEND</text>

  <!-- Web card -->
  <g filter="url(#lift)">
    <rect x="100" y="314" width="220" height="76" rx="14" fill="#28333d" stroke="#4a9e8c" stroke-opacity=".38"/>
  </g>
  <g transform="translate(134,352)">
    <circle r="3.1" fill="#61dafb"/>
    <g fill="none" stroke="#61dafb" stroke-width="1.5">
      <ellipse rx="12" ry="4.6"/>
      <ellipse rx="12" ry="4.6" transform="rotate(60)"/>
      <ellipse rx="12" ry="4.6" transform="rotate(120)"/>
    </g>
  </g>
  <text class="mono title" x="162" y="347">Web</text>
  <text class="sub" x="162" y="366">React &#183; sign2text UI</text>

  <!-- frontend vertical flow -->
  <path class="flow" d="M210,392 V 470" marker-end="url(#ah)"/>
  <text class="edge-label" x="224" y="422">natural language</text>
  <text class="edge-label" x="224" y="438">translation</text>

  <!-- GPT-4o card -->
  <g filter="url(#lift)">
    <rect x="100" y="478" width="220" height="76" rx="14" fill="#28333d" stroke="#4a9e8c" stroke-opacity=".38"/>
  </g>
  <g transform="translate(120.5,502.5) scale(1.125)" fill="#f4f6f5">
    <path d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z"/>
  </g>
  <text class="mono title" x="162" y="511">GPT-4o</text>
  <text class="sub" x="162" y="530">OpenAI &#183; phrasing</text>

  <!-- ===== BACKEND GROUP ===== -->
  <rect x="418" y="130" width="974" height="560" rx="18" fill="url(#panel)" stroke="#4a9e8c" stroke-opacity=".3" stroke-width="1.2"/>
  <rect x="418.6" y="130.6" width="972.8" height="558.8" rx="17.4" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
  <rect x="442" y="154" width="104" height="26" rx="13" fill="#4a9e8c" fill-opacity=".14" stroke="#4a9e8c" stroke-opacity=".32"/>
  <text x="494" y="171" class="grouphead" text-anchor="middle">BACKEND</text>

  <!-- docker build note -->
  <g transform="translate(470,208)" fill="#2496ed">
    <g>
      <rect x="-9" y="-10" width="4.2" height="4.2" rx=".8"/>
      <rect x="-3.8" y="-10" width="4.2" height="4.2" rx=".8"/>
      <rect x="1.4" y="-10" width="4.2" height="4.2" rx=".8"/>
      <rect x="-9" y="-4.8" width="4.2" height="4.2" rx=".8"/>
      <rect x="-3.8" y="-4.8" width="4.2" height="4.2" rx=".8"/>
      <rect x="1.4" y="-4.8" width="4.2" height="4.2" rx=".8"/>
      <rect x="6.6" y="-4.8" width="4.2" height="4.2" rx=".8"/>
    </g>
    <path d="M-14,0.6 H15 C15,8.4 8.6,12.6 0.5,12.6 C-8,12.6 -14,8.4 -14,0.6 Z"/>
  </g>
  <text class="mono" x="496" y="213" fill="#8b9a92" font-size="12.5" letter-spacing=".3px">multistage docker image build</text>

  <!-- FastAPI card -->
  <g filter="url(#lift)">
    <rect x="640" y="310" width="250" height="84" rx="14" fill="#28333d" stroke="#4a9e8c" stroke-opacity=".45"/>
  </g>
  <g transform="translate(674,352)">
    <circle r="13" fill="#009688"/>
    <path d="M1.5,-8 L-5.5,1.2 H-0.6 L-2,8 L5.5,-1.4 H0.4 Z" fill="#ffffff"/>
  </g>
  <text class="mono title" x="702" y="347">FastAPI</text>
  <text class="sub" x="702" y="366">Python &#183; WebSocket server</text>

  <!-- GloFe card -->
  <g filter="url(#lift)">
    <rect x="1080" y="300" width="260" height="92" rx="14" fill="#28333d" stroke="#4a9e8c" stroke-opacity=".45"/>
  </g>
  <g transform="translate(1116,346)">
    <path d="M0,-13.5 L7.2,-6.3 A10.2,10.2 0 1,1 -7.2,-6.3 Z" fill="#ee4c2c"/>
    <circle cx="3.6" cy="-4.6" r="1.9" fill="#28333d"/>
  </g>
  <text class="mono title" x="1146" y="335">GloFe</text>
  <text class="sub" x="1146" y="354">PyTorch &#183; gloss-free SLT</text>
  <text class="sub" x="1146" y="372" fill="#6f7d76">sign keypoints &#8594; text</text>

  <!-- how2sign card -->
  <g filter="url(#lift)">
    <rect x="1080" y="520" width="260" height="76" rx="14" fill="#28333d" stroke="#4a9e8c" stroke-opacity=".28"/>
  </g>
  <g transform="translate(1116,558)" fill="none" stroke="#8b9a92" stroke-width="1.5">
    <ellipse cy="-8" rx="10" ry="3.8"/>
    <path d="M-10,-8 V8 A10,3.8 0 0,0 10,8 V-8"/>
    <path d="M-10,0 A10,3.8 0 0,0 10,0" opacity=".7"/>
  </g>
  <text class="mono title" x="1146" y="551" font-size="16">how2sign</text>
  <text class="sub" x="1146" y="570">training dataset</text>

  <!-- OpenPose card -->
  <g filter="url(#lift)">
    <rect x="640" y="560" width="250" height="84" rx="14" fill="#28333d" stroke="#4a9e8c" stroke-opacity=".45"/>
  </g>
  <g transform="translate(674,602)" stroke="#4a9e8c" stroke-width="1.5" fill="#4a9e8c">
    <circle cy="-10" r="3" fill="none"/>
    <path d="M0,-7 V2 M-8,-3 H8 M0,2 L-6,11 M0,2 L6,11" fill="none" stroke-linecap="round"/>
    <circle cx="-8" cy="-3" r="1.8" stroke="none"/>
    <circle cx="8" cy="-3" r="1.8" stroke="none"/>
    <circle cx="-6" cy="11" r="1.8" stroke="none"/>
    <circle cx="6" cy="11" r="1.8" stroke="none"/>
  </g>
  <text class="mono title" x="702" y="597">OpenPose</text>
  <text class="sub" x="702" y="616">body &#183; hand keypoints</text>

  <!-- ===== EDGES ===== -->

  <!-- websocket duplex -->
  <path class="flow" d="M330,340 H 630" marker-end="url(#ah)"/>
  <path class="flow" d="M630,368 H 330" marker-end="url(#ah)"/>
  <text class="mono edge-accent" x="480" y="316" text-anchor="middle">ws://&#8230;</text>
  <text class="edge-label" x="480" y="392" text-anchor="middle">websocket connection</text>

  <!-- jpeg frames: Web -> OpenPose -->
  <path class="flow" d="M322,382 C 402,430 392,602 628,602" marker-end="url(#ah)"/>
  <text class="edge-label" x="505" y="588" text-anchor="middle">jpeg image frames</text>

  <!-- OpenPose -> FastAPI -->
  <path class="flow" d="M765,556 V 402" marker-end="url(#ah)"/>
  <text class="edge-label" x="784" y="470">extracted keypoints</text>

  <!-- FastAPI <-> GloFe -->
  <path class="flow" d="M898,336 H 1072" marker-end="url(#ah)"/>
  <path class="flow" d="M1072,368 H 898" marker-end="url(#ah)"/>
  <text class="edge-label" x="985" y="324" text-anchor="middle">keypoints</text>
  <text class="edge-label" x="985" y="390" text-anchor="middle">text</text>

  <!-- GloFe -> how2sign -->
  <path class="flow-dim" d="M1210,392 V 514" marker-end="url(#ah-dim)"/>
  <text class="edge-label" x="1226" y="458" opacity=".8">trained on</text>

  <!-- footer -->
  <text x="48" y="732" class="sub" font-size="12.5">Frames stream over one WebSocket &#183; OpenPose extracts keypoints &#183; GloFe decodes gloss-free text &#183; GPT-4o rewrites it as natural language</text>
</svg>
